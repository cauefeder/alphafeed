# Project-wide Gradle settings.

# AndroidX — required: every dependency in this project is an androidx.* artifact.
android.useAndroidX=true
# No legacy com.android.support deps here, so Jetifier is unnecessary (keeps builds fast).
android.enableJetifier=false

# Give the Gradle daemon enough heap for the Compose/Kotlin build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style used by the IDE.
kotlin.code.style=official

# Only generate the resources/R class fields actually used.
android.nonTransitiveRClass=true
